/* ===========================================================================
   custom_panel.css - Habillage "Navy TgMaster" pour l'app Panel (app.py)
   À placer à côté de app.py. Chargé automatiquement par app.py (voir ce fichier).
   Pour changer de direction visuelle : modifier les 6 variables de :root.
   =========================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  --accent:        #03224C;
  --accent-strong: #001A3D;
  --accent-soft:   #E7ECF3;
  --red:           #BD362F;
  --page-bg:       #F5F0E5;
  --surface:       #ffffff;
  --surface-2:     #FAF6EE;
  --border:        #E6DECF;
  --border-strong: #D6CBB6;
  --text:          #11203A;
  --text-muted:    #5B647E;
  --success:       #1F8A4C;
  --danger:        #C82020;
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-serif: 'DM Serif Display', Georgia, serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}

body, .bk-root {
  font-family: var(--font-sans) !important;
  color: var(--text);
  background: var(--page-bg) !important;
  font-size: 15px !important;
}
.bk-root .bk-Column { background: transparent; }

/* Sélecteur d'exercice */
select.bk-input, .bk-input {
  font-family: var(--font-sans) !important;
  border: 1px solid var(--border-strong) !important;
  border-radius: 8px !important;
  color: var(--text) !important;
  background: var(--surface) !important;
  font-weight: 600;
  padding: 9px 12px !important;
}
select.bk-input:focus, .bk-input:focus {
  outline: none !important;
  border-color: var(--accent) !important;
  box-shadow: 0 0 0 3px rgba(3,34,76,0.20) !important;
}
.bk-input-group label, label.bk {
  font-weight: 600 !important;
  color: var(--text-muted) !important;
  font-size: 12px !important;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* Boutons */
.bk-btn {
  font-family: var(--font-sans) !important;
  font-weight: 600 !important;
  border-radius: 8px !important;
  padding: 9px 16px !important;
  border: 1px solid transparent !important;
  transition: background .15s ease, color .15s ease;
}
.bk-btn-primary { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
.bk-btn-primary:hover { background: var(--accent-strong) !important; }
.bk-btn-default { background: var(--surface) !important; color: var(--text-muted) !important; border-color: var(--border-strong) !important; }
.bk-btn-default:hover { background: var(--surface-2) !important; color: var(--text) !important; }
.bk-btn-warning { background: transparent !important; color: var(--accent-strong) !important; border-color: var(--border-strong) !important; }
.bk-btn-warning:hover { background: var(--accent-soft) !important; }
.bk-btn-warning.bk-active { background: var(--accent-soft) !important; border-color: var(--accent) !important; }

/* Éditeur de code (Ace) */
.bk-root .ace_editor {
  border: 1px solid var(--border) !important;
  border-radius: 12px !important;
  font-family: var(--font-mono) !important;
  box-shadow: 0 1px 2px rgba(20,26,50,0.06);
  overflow: hidden;
}

/* Énoncé + feedback (panes Markdown) - plats, sans carte (les cartes sont gérées par .main-panel) */
.bk-root .markdown { line-height: 1.66; font-size: 16px; color: #20304d; }
.bk-root .markdown h3 { font-family: var(--font-serif); font-weight: 400; font-size: 21px; color: var(--accent); margin: 2px 0 10px; }
.bk-root .markdown p { margin: 8px 0; }
.bk-root .markdown strong { color: var(--accent); }
.bk-root .markdown ol, .bk-root .markdown ul { padding-left: 22px; }
.bk-root .markdown li { margin: 5px 0; }
.bk-root .markdown h3 { color: var(--text); font-weight: 800; }
.bk-root .markdown code {
  font-family: var(--font-mono) !important;
  background: var(--accent-soft);
  color: var(--accent-strong);
  padding: 1.5px 6px; border-radius: 5px; font-size: 0.86em;
}
.bk-root .markdown table {
  border-collapse: separate; border-spacing: 0;
  border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden;
  box-shadow: 0 1px 3px rgba(3,34,76,.07); margin: 10px 0;
}
.bk-root .markdown th {
  background: var(--accent); color: #fff; text-align: left; font-weight: 700;
  padding: 11px 15px !important; border-bottom: none;
}
.bk-root .markdown td {
  padding: 10px 15px !important; border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums; font-size: 15px;
}
.bk-root .markdown tr:nth-child(even) td { background: var(--surface-2); }

.bk-root hr { border: none; border-top: 1px solid var(--border); margin: 6px 0; }

/* =========================================================================
   LAYOUT MAQUETTE - header + progression / sidebar cartes / panneau + éditeur
   ========================================================================= */

/* --- En-tête gradient + barre de progression --- */
.app-header {
  background: linear-gradient(100deg, var(--accent-strong), var(--accent)) !important;
  border-radius: 16px !important;
  padding: 18px 26px !important;
  box-shadow: 0 8px 24px rgba(20,26,50,.14);
  align-items: center !important;
}
.hdr-sub {
  color: rgba(255,255,255,.78); font-size: 12.5px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
}
.hdr-title {
  color: #fff; font-family: var(--font-serif); font-size: 25px; font-weight: 400; letter-spacing: 0; margin-top: 4px;
}
.prog-wrap { text-align: right; min-width: 200px; }
.prog-pill {
  color: #fff; font-size: 13px; font-weight: 700; margin-bottom: 7px;
}
.prog-track {
  width: 200px; height: 9px; border-radius: 99px;
  background: rgba(255,255,255,.22); overflow: hidden; margin-left: auto;
}
.prog-fill {
  height: 100%; border-radius: 99px; background: #fff;
  transition: width .35s ease;
}

/* --- Sidebar « Parcours d'exercices » --- */
.sidebar {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px 14px !important;
  box-shadow: 0 1px 2px rgba(20,26,50,.06);
}
.sb-title { font-size: 15.5px; font-weight: 800; color: var(--text); }
.sb-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; margin-bottom: 6px; }
.section-head {
  font-size: 11.5px; font-weight: 700; color: var(--text-muted);
  letter-spacing: .07em; text-transform: uppercase;
  margin: 14px 6px 6px;
}

/* Carte exercice = Row [badge | bouton-label | statut] */
.exo-card {
  align-items: center !important;
  flex-wrap: nowrap !important;
  overflow: hidden !important;
  border: 1px solid var(--border) !important;
  border-radius: 11px !important;
  margin-bottom: 7px !important;
  padding: 4px 8px !important;
  background: var(--surface) !important;
  transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
}
.exo-card:hover { border-color: var(--border-strong) !important; background: var(--surface-2) !important; }
.exo-card.actif {
  border-color: var(--accent) !important;
  background: var(--accent-soft) !important;
  box-shadow: 0 0 0 3px rgba(3,34,76,.15) !important;
}
/* TOUS les enfants flex doivent pouvoir rétrécir sous la largeur de leur contenu */
.exo-card > * { min-width: 0 !important; }
/* Badge (gauche) et pastille (droite) : taille fixe, ne rétrécissent pas */
.exo-card > *:first-child { flex: 0 0 auto !important; }
.exo-card > *:last-child  { flex: 0 0 auto !important; }
/* Le bouton-label au milieu : prend l'espace restant et rétrécit */
.exo-card > *:nth-child(2) { flex: 1 1 auto !important; min-width: 0 !important; }

.exo-badge-sb {
  font-family: var(--font-mono) !important; font-size: 12.5px; font-weight: 700;
  color: var(--accent); background: var(--accent-soft);
  border: 1px solid var(--border); border-radius: 7px;
  padding: 4px 7px; min-width: 34px; text-align: center;
}
.exo-card.actif .exo-badge-sb { background: #fff; }
/* Le bouton-label occupe l'espace, transparent et sans bordure, texte tronqué proprement */
.exo-card .bk-btn, .exo-card .bk-btn-default {
  background: transparent !important; border: none !important; box-shadow: none !important;
  text-align: left !important; color: var(--text) !important;
  font-weight: 600 !important; font-size: 14px !important;
  padding: 6px 4px !important; line-height: 1.4 !important;
  min-width: 0 !important; width: 100% !important; max-width: 100% !important;
  display: block !important;
  white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important;
}
.exo-card .bk-btn:hover { background: transparent !important; color: var(--accent-strong) !important; }
.exo-stat {
  flex: 0 0 auto; width: 20px; height: 20px; border-radius: 99px;
  border: 2px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: transparent;
}
.exo-card.ok .exo-stat {
  border-color: var(--success); background: var(--success); color: #fff;
}

/* --- Panneau principal --- */
.main-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 22px 26px !important;
  box-shadow: 0 1px 2px rgba(20,26,50,.06);
}
.exo-head { align-items: center !important; }
.exo-badge {
  font-family: var(--font-mono) !important; font-weight: 800; font-size: 15px;
  color: #fff; background: var(--accent); border-radius: 9px;
  padding: 7px 11px; margin-right: 4px;
}
.exo-h-title { font-family: var(--font-serif); font-size: 24px; font-weight: 400; color: var(--text); letter-spacing: 0; }
.tag-base, .tag-avance {
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 99px;
}
.tag-base { color: var(--accent-strong); background: var(--accent-soft); }
.tag-avance { color: #fff; background: linear-gradient(100deg, var(--accent-strong), var(--accent)); }

/* --- Fenêtre éditeur style macOS --- */
.editor-window {
  border: 1px solid var(--border-strong) !important;
  border-radius: 12px !important; overflow: hidden;
  box-shadow: 0 6px 18px rgba(20,26,50,.10);
  background: #fbfbfd;
}
.editor-titlebar {
  display: flex; align-items: center; gap: 9px;
  background: var(--surface-2); border-bottom: 1px solid var(--border);
  padding: 8px 13px;
}
.editor-titlebar .dot { width: 12px; height: 12px; border-radius: 99px; display: inline-block; }
.dot-r { background: #ec6a5e; } .dot-y { background: #f4be4f; } .dot-g { background: #61c554; }
.editor-titlebar .fname {
  font-family: var(--font-mono) !important; font-size: 12px; color: var(--text-muted);
  margin-left: 6px;
}
.editor-window .ace_editor { border: none !important; border-radius: 0 !important; box-shadow: none !important; }

/* --- Carte feedback --- */
.feedback-card {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 12px; padding: 6px 18px !important; margin-top: 4px !important;
}

/* --- Corps deux colonnes responsive --- */
.body-row { align-items: flex-start !important; flex-wrap: wrap !important; gap: 16px; }
.body-row > div { min-width: 0 !important; }
.sidebar { flex: 0 0 280px !important; }
.main-panel { flex: 1 1 420px !important; min-width: 0 !important; }
/* Sur écran étroit : la sidebar passe pleine largeur au-dessus du panneau */
@media (max-width: 820px) {
  .sidebar { flex-basis: 100% !important; }
}

.consigne { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 22px !important; margin: 0 0 10px; }
.exo-banner { display:flex; align-items:center; justify-content:space-between; gap:14px;
  background: linear-gradient(100deg, var(--accent-strong), var(--accent)) !important;
  border-radius: 13px; padding: 15px 22px !important; margin: 2px 0 12px; box-shadow: 0 6px 18px rgba(3,34,76,.18); }
.exo-banner-eyebrow { color: rgba(255,255,255,.78); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.exo-banner-title { color:#fff; font-family: var(--font-serif); font-size: 24px; line-height:1.12; margin-top: 3px; }
.exo-banner-tag { flex:0 0 auto; color:#fff; border:1px solid rgba(255,255,255,.45); border-radius:99px; padding:4px 12px; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }

dden;\n}\n\n/* \u00c9nonc\u00e9 + feedback (panes Markdown) - plats, sans carte (les cartes sont g\u00e9r\u00e9es par .main-panel) */\n.bk-root .markdown { line-height: 1.66; font-size: 16px; color: #20304d; }\n.bk-root .markdown h3 { font-family: var(--font-serif); font-weight: 400; font-size: 21px; color: var(--accent); margin: 2px 0 10px; }\n.bk-root .markdown p { margin: 8px 0; }\n.bk-root .markdown strong { color: var(--accent); }\n.bk-root .markdown ol, .bk-root .markdown ul { padding-left: 22px; }\n.bk-root .markdown li { margin: 5px 0; }\n.bk-root .markdown h3 { color: var(--text); font-weight: 800; }\n.bk-root .markdown code {\n  font-family: var(--font-mono) !important;\n  background: var(--accent-soft);\n  color: var(--accent-strong);\n  padding: 1.5px 6px; border-radius: 5px; font-size: 0.86em;\n}\n.bk-root .markdown table {\n  border-collapse: separate; border-spacing: 0;\n  border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden;\n  box-shadow: 0 1px 3px rgba(3,34,76,.07); margin: 10px 0;\n}\n.bk-root .markdown th {\n  background: var(--accent); color: #fff; text-align: left; font-weight: 700;\n  padding: 11px 15px !important; border-bottom: none;\n}\n.bk-root .markdown td {\n  padding: 10px 15px !important; border-bottom: 1px solid var(--border);\n  font-variant-numeric: tabular-nums; font-size: 15px;\n}\n.bk-root .markdown tr:nth-child(even) td { background: var(--surface-2); }\n\n.bk-root hr { border: none; border-top: 1px solid var(--border); margin: 6px 0; }\n\n/* =========================================================================\n   LAYOUT MAQUETTE - header + progression / sidebar cartes / panneau + \u00e9diteur\n   ========================================================================= */\n\n/* --- En-t\u00eate gradient + barre de progression --- */\n.app-header {\n  background: linear-gradient(100deg, var(--accent-strong), var(--accent)) !important;\n  border-radius: 16px !important;\n  padding: 18px 26px !important;\n  box-shadow: 0 8px 24px rgba(20,26,50,.14);\n  align-items: center !important;\n}\n.hdr-sub {\n  color: rgba(255,255,255,.78); font-size: 12.5px; font-weight: 600;\n  letter-spacing: .06em; text-transform: uppercase;\n}\n.hdr-title {\n  color: #fff; font-family: var(--font-serif); font-size: 25px; font-weight: 400; letter-spacing: 0; margin-top: 4px;\n}\n.prog-wrap { text-align: right; min-width: 200px; }\n.prog-pill {\n  color: #fff; font-size: 13px; font-weight: 700; margin-bottom: 7px;\n}\n.prog-track {\n  width: 200px; height: 9px; border-radius: 99px;\n  background: rgba(255,255,255,.22); overflow: hidden; margin-left: auto;\n}\n.prog-fill {\n  height: 100%; border-radius: 99px; background: #fff;\n  transition: width .35s ease;\n}\n\n/* --- Sidebar \u00ab Parcours d'exercices \u00bb --- */\n.sidebar {\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: 16px; padding: 16px 14px !important;\n  box-shadow: 0 1px 2px rgba(20,26,50,.06);\n}\n.sb-title { font-size: 15.5px; font-weight: 800; color: var(--text); }\n.sb-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; margin-bottom: 6px; }\n.section-head {\n  font-size: 11.5px; font-weight: 700; color: var(--text-muted);\n  letter-spacing: .07em; text-transform: uppercase;\n  margin: 14px 6px 6px;\n}\n\n/* Carte exercice = Row [badge | bouton-label | statut] */\n.exo-card {\n  align-items: center !important;\n  flex-wrap: nowrap !important;\n  overflow: hidden !important;\n  border: 1px solid var(--border) !important;\n  border-radius: 11px !important;\n  margin-bottom: 7px !important;\n  padding: 4px 8px !important;\n  background: var(--surface) !important;\n  transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;\n}\n.exo-card:hover { border-color: var(--border-strong) !important; background: var(--surface-2) !important; }\n.exo-card.actif {\n  border-color: var(--accent) !important;\n  background: var(--accent-soft) !important;\n  box-sha
